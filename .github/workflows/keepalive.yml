# Giữ dự án Supabase (gói miễn phí) không bị tạm dừng vì một tuần không có truy cập.
# Hai ngày một lần, GitHub tự gọi Supabase một lần (đọc 1 dòng Bảng tin công khai).
# Chỉ dùng khóa publishable (khóa công khai, giống khóa trong index.html).
name: Giữ Supabase hoạt động
on:
  schedule:
    - cron: "17 1 */2 * *"   # 08:17 giờ Việt Nam, hai ngày một lần
  workflow_dispatch:          # cho phép bấm chạy tay để thử
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pcriilgfagtffgxgittk.supabase.co/rest/v1/posts_public?select=id&limit=1" \
            -H "apikey: sb_publishable_S1_uDZjOtTxPwqvYdy2M1w_kXQyk7Ta")
          echo "Supabase trả về HTTP $code"
          test "$code" = "200"
