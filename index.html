async function mineView(){var hh=await headPanel(),p=U.p,d=U.d||{},c=U.c||{},th="";try{th=localStorage.getItem("tt01_theme")||""}catch(e){}if(!xu.length)xu=[];var h='<header class="top"><div class="topi">'+HB+'<b class="brand" onclick="go(\'home\')">TT01</b><span style="flex:1"></span><button class="btn sm alt" style="width:auto;margin:0" onclick="go(\'home\')">Trang chủ</button></div></header>';h+='<div class="card" style="text-align:center"><div style="display:grid;place-items:center">'+av({name:p.name||U.s.user.email,photo_path:p.photo_path},88)+'</div><h2 style="margin:10px 0 2px">'+esc(p.name)+'</h2><div class="mute">'+esc(U.s.user.email)+'</div>'+(U.roles.length?'<div style="margin-top:6px">'+U.roles.map(function(r){return '<span class="tag s-done">'+esc(U.rl[r]||r)+'</span>'}).join(" ")+'</div>':'')+(U.offices.length?'<div style="margin-top:6px">'+U.offices.map(function(o){var ex=o.term_end&&new Date(o.term_end+"T23:59:59")<new Date();return '<span class="tag s-sent">'+esc(U.rl[o.office]||o.office)+(o.floor?" "+o.floor:"")+(o.status==="interim"?" (lâm thời)":"")+(ex?" (hết nhiệm kỳ)":"")+'</span>'}).join(" ")+'</div>':'')+'<label class="btn sm alt" style="margin:10px 0 0;display:inline-block;cursor:pointer">Đổi ảnh đại diện<input type="file" accept="image/*" hidden onchange="setPhoto(this)"></label></div>';h+='<div class="card"><b>Thông tin cá nhân</b><label>Họ và tên</label><input id="mn" value="'+esc(p.name)+'"><label>Năm sinh</label><input id="my" inputmode="numeric" value="'+esc(d.yob||"")+'"><label>Giới tính</label><select id="mg"><option value="">Không nêu</option>'+["Nam","Nữ","Khác"].map(function(g){return '<option'+(d.gender===g?" selected":"")+'>'+g+'</option>'}).join("")+'</select><label>Bằng cấp, học vấn</label><input id="me" value="'+esc(d.edu||"")+'"><label>Nghề nghiệp</label><input id="mj" value="'+esc(d.job||"")+'"><label>Kinh nghiệm làm việc</label><textarea id="mx" rows="3">'+esc(d.exp||"")+'</textarea><label>Remark (ghi chú)</label><textarea id="mr" rows="2">'+esc(d.remark||"")+'</textarea><label>Ai xem được thông tin này?</label><select id="mp"><option value="0"'+(d.is_public?"":" selected")+'>Riêng tư, chỉ admin thấy</option><option value="1"'+(d.is_public?" selected":"")+'>Công khai cho cư dân</option></select><label>Số điện thoại</label><input id="mt" inputmode="tel" value="'+esc(c.phone||"")+'"><label>Ai thấy số điện thoại?</label><select id="mv"><option value="floor"'+(c.vis==="all"?"":" selected")+'>Chỉ thành viên cùng tầng</option><option value="all"'+(c.vis==="all"?" selected":"")+'>Tất cả cư dân</option></select><button class="btn" onclick="saveMe()">Lưu</button></div>';h+='<div class="card"><b>Căn hộ của tôi</b>'+U.units.map(function(u){var lb=u.status==="verified"?(u.is_head?"Chủ hộ, đã xác minh":"Đã xác minh"):u.status==="pending"?"Chờ xác minh":u.status==="revoked"?"Đã thu hồi xác minh":"Bị từ chối",bad=u.status==="rejected"||u.status==="revoked";return '<div class="stat"><span>Tầng '+u.units.floor+' · căn '+esc(u.units.label)+' · '+relL(u.relation)+'</span><span class="tag s-'+(u.status==="verified"?"done":u.status==="pending"?"sent":"new")+'">'+lb+'</span></div>'+(bad?'<div class="note" style="margin:4px 0 10px"><div>'+(u.reason?'Lý do: '+esc(u.reason):'Chưa có lý do ghi kèm.')+'</div><button class="btn sm alt" style="margin-top:6px" onclick="reUnit('+u.units.floor+',\''+esc(u.units.label)+'\',\''+u.relation+'\')">Khai lại căn này</button></div>':'')+(u.status==="verified"&&u.is_head?'<div class="mute" style="margin:2px 0 8px">Bạn là chủ hộ: nhượng quyền chủ hộ trước nếu muốn xóa căn này.</div>':'<button class="btn sm alt" style="width:auto;margin:2px 0 10px;color:var(--red)" onclick="cf(this,function(){delUnit('+u.id+')})">Xóa căn này</button>')}).join("")+hh+'<div id="urows">'+(xu.length?uRows():"")+'</div>'+(xu.length?'<button class="btn sm" style="margin-top:8px" onclick="saveUnits(false)">Gửi khai báo</button>':'')+'<button class="btn sm alt" style="margin-top:8px" onclick="addRow()">+ Thêm căn hộ</button></div>';if(canVerify())h+='<button class="btn alt" onclick="go(\'verify\')">Xác minh căn hộ cho cư dân'+(U.pend?' ('+U.pend+' đang chờ)':'')+'</button>';h+='<div class="card"><b>Giao diện</b><div class="row" style="margin-top:8px">'+[["","Theo máy"],["light","Sáng"],["dark","Tối"]].map(function(t){return '<button class="chip'+(th===t[0]?" on":"")+'" onclick="setTheme(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")+'</div></div><div class="card"><b>Tài khoản</b><div class="mute">'+esc(U.s.user.email)+'</div><button class="btn alt" onclick="logout()">Đăng xuất</button></div>';return h}
function saveMe(){act(async function(){var id=U.s.user.id,y=v("my"),yob=y?parseInt(y,10):null;if(y&&(isNaN(yob)||yob<1900||yob>new Date().getFullYear()))return toast("Năm sinh không hợp lệ");var n=v("mn");if(n.length<2)return toast("Nhập họ và tên");await q(sb.from("profiles").update({name:n}).eq("id",id));await q(sb.from("profile_details").upsert({user_id:id,yob:yob,gender:v("mg")||null,edu:v("me")||null,job:v("mj")||null,exp:v("mx")||null,remark:v("mr")||null,is_public:v("mp")==="1"}));await q(sb.from("contacts").upsert({user_id:id,phone:v("mt")||null,vis:v("mv")}));await loadMe();toast("Đã lưu");refresh()})}
function setPhoto(inp){var f=inp.files[0];if(!f)return;act(async function(){var id=U.s.user.id,b=await resizeTo(f,320,true),path=id+"/avatar-"+Date.now()+".jpg",r=await sb.storage.from("public-media").upload(path,b,{contentType:"image/jpeg"});if(r.error)throw r.error;var old=U.p.photo_path;await q(sb.from("profiles").update({photo_path:path}).eq("id",id));if(old)sb.storage.from("public-media").remove([old]);await loadMe();refresh()})}
/* ===== Xác minh căn ===== */
async function verifyView(){var me=U.s.user.id,l=await q(sb.from("user_units").select("*, profiles!user_id(name), units!unit_id(floor,label)").eq("status","pending").order("id")),o=l.filter(function(r){return r.user_id!==me});return bar("Xác minh căn hộ","mine")+'<p class="mute">Bạn chỉ thấy các yêu cầu bạn có quyền xác minh. Người thuê và người sống cùng do chủ hộ của căn xác minh. Mỗi căn có một chủ hộ, là người duy nhất bỏ phiếu cho căn đó.</p>'+(o.map(function(r){return '<div class="card"><b>'+esc(r.profiles&&r.profiles.name||"Cư dân")+'</b><div class="mute">Tầng '+r.units.floor+' · căn '+esc(r.units.label)+' · khai là '+relL(r.relation)+' · '+ago(r.created_at)+(r.reason?' · '+esc(r.reason):'')+'</div><div class="row" style="margin-top:8px">'+(r.relation==="owner"?'<button class="btn sm" onclick="verifyU('+r.id+',true,true)">Xác minh, chọn làm chủ hộ</button><button class="btn sm alt" onclick="verifyU('+r.id+',true,false)">Xác minh (không phải chủ hộ)</button>':'<button class="btn sm" onclick="verifyU('+r.id+',true,false)">Xác minh '+relL(r.relation)+'</button>')+'<button class="btn sm alt" style="color:var(--red)" onclick="rjUi(\'rj\','+r.id+')">Từ chối</button></div><div id="rj'+r.id+'"></div></div>'}).join("")||'<p class="mute">Không có yêu cầu nào đang chờ.</p>')}
function verifyU(id,ok,head,why){act(async function(){await q(sb.rpc("verify_unit",{p_user_unit:id,p_approve:ok,p_head:head,p_reason:why||null}));toast(ok?"Đã xác minh":"Đã từ chối");refresh()})}
/* ===== Cột bên (chỉ hiện trên desktop) ===== */
async function sideHtml(){var all=await loadCases(),ps=await q(sb.from("posts").select("id,title,type,created_at").in("type",["Thông báo","Sự kiện"]).order("created_at",{ascending:false}).limit(4)),wait=all.filter(function(c){return["new","sent","replied"].indexOf(c.status)>-1}).length,done=all.filter(function(c){return c.status==="done"}).length,h='<div class="card"><h3>Tòa TT01</h3><div class="sst"><div><b>'+all.length+'</b><span>Phản ánh</span></div><div><b>'+wait+'</b><span>Đang chờ</span></div><div><b>'+done+'</b><span>Đã xử lý</span></div></div></div><button class="btn" style="margin:0 0 14px" onclick="newCase()">📷 Gửi phản ánh</button>';h+='<div class="card"><h3>Thông báo mới</h3>'+(ps.map(function(p){return '<button class="sl" onclick="go(\'post\','+p.id+')"><b>'+esc(p.title)+'</b><small>'+esc(p.type)+' · '+ago(p.created_at)+'</small></button>'}).join("")||'<span class="mute">Chưa có thông báo.</span>')+'</div>';h+='<div class="card"><h3>Căn hộ của tôi</h3>'+U.units.map(function(u){var lb=u.status==="verified"?(u.is_head?"Chủ hộ":"Đã xác minh"):u.status==="pending"?"Chờ xác minh":"Bị từ chối";return '<div class="stat"><span>Tầng '+u.units.floor+' · căn '+esc(u.units.label)+'</span><span class="tag s-'+(u.status==="verified"?"done":u.status==="pending"?"sent":"new")+'">'+lb+'</span></div>'}).join("")+'<button class="sl" onclick="go(\'mine\')"><b>Quản lý hồ sơ và căn hộ ›</b></button>'+(canVerify()?'<button class="sl" onclick="go(\'verify\')"><b>Xác minh căn hộ cho cư dân ›</b></button>':'')+'</div>';return h}

var VIEWS={home:homeView,voc:vocView,"new":newView,"case":caseView,feed:feedView,post:postView,newpost:newPostView,mine:mineView,verify:verifyView,board:boardView,settings:settingsView,activity:activityView,newact:newActView};
try{window.matchMedia("(min-width:1000px)").addEventListener("change",function(){if(U.s&&U.p)render()})}catch(e){}
window.addEventListener("hashchange",function(){if(U.s&&U.p){fromHash();render()}});
async function init(){applyTheme();try{var r=await sb.auth.getSession();U.s=r.data.session}catch(e){console.error(e)}sb.auth.onAuthStateChange(function(ev,s){U.s=s});await boot()}
init();

function rjUi(kind,id){var box=$("rj"+id);if(!box)return;var rv=kind==="rv";box.innerHTML='<div class="mute" style="margin:8px 0 4px">Chọn lý do, người bị '+(rv?"thu hồi":"từ chối")+' sẽ thấy:</div><div class="chips">'+(rv?RV:RJ).map(function(t,i){return '<button class="chip" onclick="'+(rv?"revokeU":"rejectU")+'('+id+','+i+')">'+t+'</button>'}).join("")+'</div>'}
function rejectU(id,i){verifyU(id,false,false,RJ[i])}
function revokeU(id,i){act(async function(){await q(sb.rpc("revoke_unit",{p_user_unit:id,p_reason:RV[i]}));var m=document.querySelector(".pm");if(m)m.remove();toast("Đã thu hồi xác minh");refresh()})}
function xferU(unit,uid){act(async function(){await q(sb.rpc("transfer_head",{p_unit:unit,p_to:uid}));await loadMe();toast("Đã nhượng quyền chủ hộ");refresh()})}
function reUnit(f,l,r){xu=[{f:String(f),u:l,r:r}];refresh()}
async function headPanel(){var hs=verifiedUnits().filter(function(u){return u.is_head});if(!hs.length)return"";var me=U.s.user.id,h="";for(var i=0;i<hs.length;i++){var u=hs[i],l=(await q(sb.from("user_units").select("*, profiles!user_id(name)").eq("unit_id",u.unit_id).neq("user_id",me).in("status",["pending","verified"]).order("id")));h+='<div class="card"><b>Người trong căn '+esc(u.units.label)+'</b><div class="mute">Bạn là chủ hộ: bạn xác minh người thuê, người sống cùng và có thể nhượng quyền chủ hộ.</div>'+(l.map(function(r){var nm=esc(r.profiles&&r.profiles.name||"Cư dân");return '<div class="stat" style="margin-top:8px"><span>'+nm+' · '+relL(r.relation)+(r.is_head?" (chủ hộ)":"")+'</span><span class="tag s-'+(r.status==="verified"?"done":"sent")+'">'+(r.status==="verified"?"Đã xác minh":"Chờ xác minh")+'</span></div><div class="row">'+(r.status==="pending"?'<button class="btn sm" onclick="verifyU('+r.id+',true,false)">Xác minh</button><button class="btn sm alt" style="color:var(--red)" onclick="rjUi(\'rj\','+r.id+')">Từ chối</button>':(r.relation!=="tenant"&&!r.is_head?'<button class="btn sm alt" onclick="cf(this,function(){xferU('+u.unit_id+',\''+r.user_id+'\')})">Nhượng quyền chủ hộ</button>':'')+'<button class="btn sm alt" style="color:var(--red)" onclick="rjUi(\'rv\','+r.id+')">Thu hồi xác minh</button>')+'</div><div id="rj'+r.id+'"></div>'}).join("")||'<p class="mute">Chưa có ai khác trong căn này.</p>')+'</div>'}return h}

function delUnit(id){act(async function(){await q(sb.rpc("delete_my_unit",{p_user_unit:id}));await loadMe();toast("Đã xóa căn khai nhầm");refresh()})}
