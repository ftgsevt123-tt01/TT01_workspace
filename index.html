async function boardDash(){var st=null,tot=null;try{var r=await Promise.all([(TW.multi?sb.rpc("tt01_stats_for",{p_tower:bTw()}):sb.rpc("tt01_stats")),sb.from("settings").select("value").eq("key","total_units").maybeSingle()]);if(!r[0].error)st=(r[0].data||[])[0]||null;tot=r[1]&&r[1].data?Number(r[1].data.value)||null:null}catch(e){}

    +(pct!=null?'<div class="dprog"><div class="row" style="justify-content:space-between"><span>Mục tiêu đề án: 60% số căn tham gia</span><b>'+pct+'% / '+tot+' căn</b></div><div class="rb"><i style="width:'+Math.min(100,pct)+'%"></i><em style="left:60%"></em></div></div>':'')
    +'<div class="dsub">'+st.floors_with_rep+' tầng đã có đại diện'+(uj==null?' · Chạy patch 10 để hiện số căn và thành viên':'')+(tot==null&&can("manage_settings")?' · Nhập tổng số căn của tòa trong Cài đặt để theo dõi tiến độ 60%':'')+'</div>'}
/* ===== Tìm kiếm theo từ khóa (trang chủ + trang Tìm kiếm). Gõ có dấu hoặc không dấu đều được ===== */
var srQ="",srF="all",srC=null,srT=null;
function srNorm1(ch){var x=ch.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");if(x==="đ")x="d";return x.length===1?x:ch.toLowerCase().slice(0,1)}
function srNorm(t){return Array.prototype.map.call(String(t||""),srNorm1).join("")}
function srTerms(t){return srNorm(t).split(/[^a-z0-9]+/).filter(function(w){return w.length>0})}
function srBox(id,val,big){return '<div class="srch'+(big?" big":"")+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="'+id+'" type="search" enterkeyhint="search" autocomplete="off" value="'+esc(val||"")+'" placeholder="Tìm phản ánh, bảng tin, sổ tay..." oninput="srInput(this,'+(big?1:0)+')" onkeydown="if(event.key===\'Enter\'){srQ=this.value;go(\'search\')}"></div>'}
function srchBox(){return srBox("hsq",srQ,false)+'<div id="hsr"></div>'}
function srInput(inp,full){clearTimeout(srT);srQ=inp.value;srT=setTimeout(function(){srShow(full)},250)}
async function srData(){if(srC&&Date.now()-srC.t<60000)return srC;var r=await Promise.all([sb.from("posts").select("id,type,title,body,source,created_at,hidden,approved").order("created_at",{ascending:false}).limit(300),loadCases().catch(function(){return[]}),hbVisible()?sb.from("hb_items").select("id,kind,title,body,source,created_at").order("created_at",{ascending:false}).limit(400):Promise.resolve({data:[]}),modVisible("board")?sb.from("activities").select("id,title,body,who,created_at").order("created_at",{ascending:false}).limit(200):Promise.resolve({data:[]})]);
  var L=[];(r[0].data||[]).forEach(function(p){L.push({s:"feed",v:"post",id:p.id,ic:"📢",tag:p.type,t:p.title,b:(p.body||"")+" "+(p.source||""),d:p.created_at})});
  (r[1]||[]).forEach(function(c){L.push({s:"voc",v:"case",id:c.id,ic:"📷",tag:ST[c.status],t:c.topic+", "+c.area,b:(c.description||"")+" Tầng "+c.floor,d:c.created_at})});
  (r[2].data||[]).forEach(function(x){var k={doc:["📄","Tài liệu"],tip:["💡","Mẹo vặt"],question:["❓","Hỏi đáp"]}[x.kind]||["📘","Sổ tay"];L.push({s:"hb",v:"hbitem",id:x.id,ic:k[0],tag:k[1],t:x.title,b:(x.body||"")+" "+(x.source||""),d:x.created_at})});
  (r[3].data||[]).forEach(function(a){L.push({s:"act",v:"activity",id:a.id,ic:"🏢",tag:"Hoạt động",t:a.title,b:(a.body||"")+" "+(a.who||""),d:a.created_at})});
  L.forEach(function(x){x.nt=srNorm(x.t);x.nb=srNorm(x.b)});srC={t:Date.now(),L:L};return srC}
function srFind(L,q){var w=srTerms(q);if(!w.length)return[];return L.filter(function(x){return w.every(function(k){return x.nt.indexOf(k)>-1||x.nb.indexOf(k)>-1})}).map(function(x){var sc=w.reduce(function(s,k){return s+(x.nt.indexOf(k)>-1?3:0)+(x.nb.indexOf(k)>-1?1:0)},0);return{x:x,sc:sc}}).sort(function(a,b){return b.sc-a.sc||ts(b.x.d)-ts(a.x.d)}).map(function(o){return o.x})}
function srMark(orig,norm,w){var hits=[];w.forEach(function(k){var i=norm.indexOf(k);while(i>-1&&hits.length<40){hits.push([i,i+k.length]);i=norm.indexOf(k,i+k.length)}});hits.sort(function(a,b){return a[0]-b[0]});var o="",p=0;hits.forEach(function(h){if(h[0]<p)return;o+=esc(orig.slice(p,h[0]))+'<mark>'+esc(orig.slice(h[0],h[1]))+'</mark>';p=h[1]});return o+esc(orig.slice(p))}
function srSnip(x,w){var i=-1;w.some(function(k){i=x.nb.indexOf(k);return i>-1});if(i<0)return esc(x.b.slice(0,110))+(x.b.length>110?"…":"");var a=Math.max(0,i-35),b=Math.min(x.b.length,i+95);return(a?"…":"")+srMark(x.b.slice(a,b),x.nb.slice(a,b),w)+(b<x.b.length?"…":"")}
function srRow(x,w){return '<button class="srr" onclick="go(\''+x.v+'\','+x.id+')"><span class="sri">'+x.ic+'</span><span class="srx"><b>'+srMark(x.t,x.nt,w)+'</b><small>'+srSnip(x,w)+'</small><em>'+esc(x.tag||"")+' · '+ago(x.d)+'</em></span></button>'}
var SRS=[["feed","Bảng tin"],["voc","Phản ánh"],["hb","Sổ tay"],["act","Hoạt động"]];
async function srShow(full){var box=$(full?"srr":"hsr");if(!box)return;var q0=srQ.trim();if(srTerms(q0).length===0||q0.length<2){box.innerHTML=full?'<p class="mute">Gõ ít nhất 2 ký tự. Có thể gõ không dấu, ví dụ "cat nuoc".</p>':"";return}
  var D;try{D=await srData()}catch(e){box.innerHTML='<p class="mute">Không tải được dữ liệu tìm kiếm.</p>';return}if(srQ.trim()!==q0)return;
  var w=srTerms(q0),res=srFind(D.L,q0),by={};res.forEach(function(x){(by[x.s]=by[x.s]||[]).push(x)});
  if(!res.length){box.innerHTML='<div class="card srbox"><p class="mute" style="margin:0">Không tìm thấy kết quả cho "'+esc(q0)+'".</p></div>';return}
  if(!full){box.innerHTML='<div class="card srbox">'+SRS.filter(function(s){return by[s[0]]}).map(function(s){return '<div class="srh">'+s[1]+' ('+by[s[0]].length+')</div>'+by[s[0]].slice(0,3).map(function(x){return srRow(x,w)}).join("")}).join("")+'<button class="btn sm alt" style="width:100%;margin-top:10px" onclick="go(\'search\')">Xem tất cả '+res.length+' kết quả</button></div>';return}
  if(srF!=="all"&&!by[srF])srF="all";
  box.innerHTML='<div class="chips">'+[["all","Tất cả ("+res.length+")"]].concat(SRS.filter(function(s){return by[s[0]]}).map(function(s){return[s[0],s[1]+" ("+by[s[0]].length+")"]})).map(function(s){return '<button class="chip'+(srF===s[0]?" on":"")+'" onclick="srF=\''+s[0]+'\';srShow(1)">'+s[1]+'</button>'}).join("")+'</div><div class="card srbox">'+(srF==="all"?res:by[srF]).slice(0,100).map(function(x){return srRow(x,w)}).join("")+'</div>'}
