<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TT01 - Cộng đồng cư dân</title>
<meta name="theme-color" content="#2d6a55">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f2;--card:#fff;--ink:#1c2924;--mute:#5c6b64;--line:#dbe2de;--teal:#2d6a55;--amber:#7a8a83;--red:#c8432b;--green:#2c7a4b;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#16201c;--ink:#e6eee9;--mute:#97a59e;--line:#25322c;--teal:#7fd1b0;--amber:#a3b2ab;--red:#ff8b73;--green:#6cc58b;--on:#0e1512;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#16201c;--ink:#e6eee9;--mute:#97a59e;--line:#25322c;--teal:#7fd1b0;--amber:#a3b2ab;--red:#ff8b73;--green:#6cc58b;--on:#0e1512;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;font-weight:800;margin:0}h2{font-size:18px;font-weight:600;margin:20px 0 8px}
.mute{color:var(--mute);font-size:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:0;background:none;color:var(--teal);font:600 16px inherit;padding:8px 0;cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:30px;font-weight:800;color:var(--teal);line-height:1}
.tile.main{background:var(--teal);border-color:var(--teal);color:var(--on)}.tile.main b{color:var(--on)}
.tile span{font-weight:600}.tile small{font-size:13px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card img{width:100%;border-radius:8px;display:block;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;border:1px solid currentColor}
.s-new{color:var(--mute)}.s-sent{color:var(--amber)}.s-replied{color:var(--teal)}.s-done{color:var(--green)}.urgent{color:var(--red)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.btn{border:0;border-radius:10px;padding:12px 16px;font:600 16px inherit;background:var(--teal);color:var(--on);cursor:pointer;width:100%;margin-top:12px}
.btn.alt{background:none;color:var(--teal);border:1px solid var(--teal)}.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
.btn:disabled{opacity:.5}
video,canvas.pv{width:100%;border-radius:10px;background:#000}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.shots img{width:100%;border-radius:8px}
.hash{font:12px ui-monospace,monospace;color:var(--mute);word-break:break-all}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.stat b{font-size:20px}
.foot{margin-top:28px;text-align:center}.foot a{color:var(--mute);font-size:13px}
.note{font-size:13px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:16px}
#app{padding-bottom:96px}@media(min-width:900px){#app{max-width:760px;padding-top:28px}.nav{left:calc(50% - 320px);right:auto;width:640px;bottom:16px;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.12)}.nav button{cursor:pointer}.card,.news,.feat{transition:background .15s}.card:hover{border-color:var(--teal)}.quick{grid-template-columns:repeat(4,1fr)}}
.hero{background:var(--teal);color:var(--on);border-radius:18px;padding:16px;margin-bottom:12px}.hero h1{margin:4px 0 12px}.hero .mute,.hero a{color:var(--on);opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:rgba(255,255,255,.18);border-radius:12px;padding:8px;text-align:center}.stats b{display:block;font-size:24px;font-weight:800}.stats span{font-size:12px}
.alert{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px;cursor:pointer}.alert small{color:var(--amber);font-weight:800;font-size:11px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.quick button{border:0;background:none;color:var(--ink);font:600 12px inherit;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}.quick i{font-style:normal;font-size:24px;width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}.quick em{position:absolute;top:-4px;right:8px;background:var(--red);color:#fff;font:700 11px inherit;border-radius:99px;padding:1px 6px;font-style:normal}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 14px inherit;cursor:pointer}.chip.on{background:var(--teal);color:var(--on);border-color:var(--teal)}
.feat{margin:6px 0 14px;cursor:pointer}.fimg{width:100%;height:180px;border-radius:14px;object-fit:cover;display:grid;place-items:center;font-size:56px}.feat h2{margin:8px 0 4px}
.news{display:flex;gap:12px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.news b{display:block;margin:4px 0}.news p{margin:0 0 4px;font-size:14px}.thumb{flex:none;width:96px;height:96px;border-radius:10px;object-fit:cover;display:grid;place-items:center;font-size:34px}
.t0{background:linear-gradient(135deg,#2d6a55,#8cc9ae)}.t1{background:linear-gradient(135deg,#5b6fd6,#9aa8f0)}.t2{background:linear-gradient(135deg,#b4442f,#f09a85)}.t3{background:linear-gradient(135deg,#c98408,#f2c46a)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}.nav button{border:0;background:none;color:var(--mute);font:600 11px inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:64px}.nav button.on{color:var(--teal)}.nav i{font-style:normal;font-size:22px}
.pin{border-color:var(--amber);border-width:2px}.pin small{color:var(--amber);font-weight:700}.step{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.gal{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.gal img{height:120px;border-radius:10px}
.stats div:nth-child(2){background:var(--amber);color:#1f1100}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;object-fit:cover}
.person{display:flex;gap:12px;align-items:flex-start}

/* ---- glass / gradient layer ---- */
:root{--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.4);--hair:rgba(20,33,61,.09);--sh:0 8px 28px -12px rgba(36,88,74,.28);--g1:#3b8068;--g2:#24584a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(24,34,58,.55);--glass2:rgba(24,34,58,.35);--hair:rgba(255,255,255,.09);--sh:0 10px 30px -14px rgba(0,0,0,.7);--g1:#2f7a62;--g2:#1a4538}}
:root[data-theme="dark"]{--glass:rgba(24,34,58,.55);--glass2:rgba(24,34,58,.35);--hair:rgba(255,255,255,.09);--sh:0 10px 30px -14px rgba(0,0,0,.7);--g1:#2f7a62;--g2:#1a4538}
body{background:radial-gradient(60% 40% at 90% -5%,color-mix(in srgb,var(--amber) 22%,transparent),transparent 70%),radial-gradient(70% 50% at -10% 10%,color-mix(in srgb,var(--teal) 20%,transparent),transparent 70%),radial-gradient(80% 40% at 50% 110%,color-mix(in srgb,var(--teal) 14%,transparent),transparent 70%),var(--bg);background-attachment:fixed;font-weight:350}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:1}
h1{font-weight:700;letter-spacing:-.01em}h2{font-weight:600;letter-spacing:-.005em}
.card,.tile,.alert,.note,.stat{background:var(--glass);border:1px solid var(--hair);box-shadow:var(--sh);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.card{border-radius:16px}.stat{box-shadow:none;border:0;border-bottom:1px solid var(--hair);background:none;backdrop-filter:none}
.note{border-style:dashed}
.tile.main,.hero{background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid rgba(255,255,255,.18);box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--amber) 55%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.stats div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stats div:nth-child(2){background:linear-gradient(135deg,color-mix(in srgb,var(--amber) 85%,#fff),var(--amber));color:#2a1400;border-color:rgba(255,255,255,.3)}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 20px -10px var(--g2),inset 0 1px 0 rgba(255,255,255,.25);border-radius:14px;font-weight:600}
.btn.alt{background:var(--glass2);color:var(--teal);border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:active{transform:scale(.985)}
input,select,textarea{background:var(--glass2);border:1px solid var(--hair);border-radius:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
.chip{background:var(--glass2);border:1px solid var(--hair);font-weight:500;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px var(--g2)}
.tag{border:0;font-weight:600;background:color-mix(in srgb,currentColor 13%,transparent)}
.s-new{background:color-mix(in srgb,var(--mute) 14%,transparent)}
.nav{background:color-mix(in srgb,var(--card) 88%,transparent);border-top:1px solid var(--hair);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.nav button{font-weight:500}.nav button.on{color:var(--teal);font-weight:700}
.quick i{background:var(--glass);border:1px solid var(--hair);box-shadow:var(--sh);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:18px}
.alert{border-left:0;position:relative;overflow:hidden;border-radius:16px}.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--amber),transparent)}
.pin{border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--amber) 14%,var(--glass)),var(--glass))}
.news{border-top:1px solid var(--hair)}
.thumb,.fimg,.gal img,.shots img,.card img{border-radius:14px}
.t0{background:linear-gradient(135deg,#2d6a55,#9bd6bd)}.t1{background:linear-gradient(135deg,#5f8f7e,#c3dfd3)}.t2{background:linear-gradient(135deg,#8a6a5c,#d9bfb2)}.t3{background:linear-gradient(135deg,#7a8a83,#cfd8d3)}
@media(min-width:900px){.nav{left:calc(50% - 320px);right:auto;width:640px;bottom:16px;border-radius:18px;background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--hair);box-shadow:var(--sh)}.card:hover{border-color:color-mix(in srgb,var(--teal) 50%,transparent)}}

/* ---- instagram-style + top header ---- */
#app{padding-top:76px;padding-bottom:40px}
.top{position:fixed;top:0;left:0;right:0;z-index:8;background:color-mix(in srgb,var(--card) 82%,transparent);border-bottom:1px solid var(--hair);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);padding-top:env(safe-area-inset-top,0px)}
.topi{max-width:760px;margin:0 auto;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px}
.brand{font-weight:800;font-size:18px;letter-spacing:.02em;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;margin-right:4px}
.top nav{flex:1;display:flex;justify-content:space-around;gap:2px}
.top nav button{border:0;background:none;color:var(--mute);font:500 10px inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;border-radius:12px;cursor:pointer;position:relative}
.top nav i{font-style:normal;font-size:20px}
.top nav button.on{color:var(--teal);font-weight:700}.top nav button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-4px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.top .me{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer}.top .me.on{box-shadow:0 0 0 2px var(--teal)}
@media(min-width:700px){.top nav{justify-content:flex-start;gap:6px;margin-left:12px}.top nav button{flex-direction:row;gap:6px;font-size:14px;padding:8px 14px}}
.ig{background:var(--glass);border:1px solid var(--hair);border-radius:18px;margin:14px 0;overflow:hidden;box-shadow:var(--sh);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.igh{display:flex;gap:10px;align-items:center;padding:10px 12px}.igh>div:not(.av){flex:1;min-width:0}.igh .mute{font-size:12px}
.igm{cursor:pointer;background:var(--line)}.igm img,.igm .ph,.igm .igimg{width:100%;aspect-ratio:1/1;max-height:520px;object-fit:cover;display:grid;place-items:center;margin:0;border-radius:0;height:auto}
.igm .ph{font-size:72px}
.iga{display:flex;gap:2px;padding:6px 8px 0;align-items:center}.iga button{border:0;background:none;font:600 15px inherit;color:var(--ink);padding:6px 10px;border-radius:99px;cursor:pointer;display:flex;gap:6px;align-items:center}
.iga button.on{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}.iga .angry:not(.on) .e{filter:grayscale(1);opacity:.6}.iga .e{font-size:20px}
.igc{padding:4px 14px 12px;font-size:15px}.cm{display:flex;gap:8px;margin:8px 0}.cmi{display:flex;gap:8px;margin-top:8px;align-items:center}.cmi input{flex:1;border-radius:99px;padding:8px 14px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:6px 0 10px}.story{flex:none;text-align:center;font-size:12px;width:64px;cursor:pointer}.story .ring{display:inline-block;padding:2px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--amber))}.story .av{border:2px solid var(--bg)}
@media(min-width:900px){.igm img,.igm .ph,.igm .igimg{aspect-ratio:16/10}#app{padding-top:84px}}
.igs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.igs::-webkit-scrollbar{display:none}.igs>img{flex:none;width:100%;scroll-snap-align:center}
.igm{position:relative}.igcnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font:600 12px inherit;padding:3px 9px;border-radius:99px;pointer-events:none}
.igd{display:flex;justify-content:center;gap:5px;padding:8px 0 0}.igd i{width:6px;height:6px;border-radius:50%;background:var(--line)}.igd i.on{background:var(--teal)}
.opl{border:0;background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}.opl svg{width:17px;height:17px}
@media(max-width:899px){.ig{margin:0 -16px 6px;border-radius:0;border-left:0;border-right:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}.ig+.ig{margin-top:10px}}

.top nav button{font:600 13px inherit;padding:8px 6px}.top nav button.on::after{bottom:0}
@media(min-width:700px){.top nav button{font-size:14px;padding:8px 14px}}
.seg{order:-1;flex:none;margin-top:6px;display:flex;padding:3px;border-radius:99px;border:1px solid var(--hair);background:var(--glass2);margin-bottom:10px}.seg button{border:0;background:none;color:var(--mute);font:600 12px inherit;padding:5px 11px;border-radius:99px;cursor:pointer}.seg button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}

.prog{display:flex;margin:6px 0 16px;padding:12px 6px 10px;border-radius:16px;background:var(--glass);border:1px solid var(--hair);box-shadow:var(--sh)}
.ps{flex:1;text-align:center;position:relative;font-size:12px}.ps::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}.ps:first-child::before{display:none}
.ps.ok::before,.ps.cur::before{background:linear-gradient(90deg,var(--g1),var(--g2))}.ps.bad::before{background:var(--red)}
.ps i{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-style:normal;font-weight:700;color:var(--mute);font-size:13px}
.ps.ok i{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff}.ps.cur i{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 18%,transparent)}.ps.bad i{background:var(--red);border-color:transparent;color:#fff;box-shadow:none}
.ps b{display:block;font-weight:600}.ps small{display:block;color:var(--mute);font-size:10px;min-height:12px}.ps.cur b{color:var(--teal)}.ps.bad b{color:var(--red)}
.mini{display:flex;gap:3px;margin:8px 0 4px}.mini span{flex:1;height:4px;border-radius:4px;background:var(--line)}.mini span.f{background:linear-gradient(90deg,var(--g1),var(--g2))}.mini span.c{background:color-mix(in srgb,var(--teal) 45%,var(--line))}.mini.bad span.f{background:var(--red)}
.s-drop{color:var(--red)}

.u2{display:grid;grid-template-columns:1fr 1fr 36px;gap:10px;align-items:center;margin:6px 0}.u2.hd{font-weight:600;font-size:13px;color:var(--mute);margin-bottom:0}.u2 input{margin:0}.u2.val{padding:8px 0;border-top:1px solid var(--hair);margin:0}.xbtn{border:0;background:none;color:var(--red);font-size:18px;cursor:pointer}

.hb{border:0;background:none;color:var(--ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;margin-left:-4px}.hb svg{width:24px;height:24px}.hb:active{background:var(--line)}
.dov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);animation:dfi .18s}.dp{position:absolute;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--card);padding:calc(env(safe-area-inset-top,0px) + 16px) 8px 16px;overflow-y:auto;box-shadow:6px 0 30px rgba(0,0,0,.2);animation:dsl .22s}
.dp h4{margin:14px 14px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.dp .di{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);font-size:15px;font-weight:600;font-family:inherit;padding:12px 14px;border-radius:12px;text-align:left;cursor:pointer}.dp .di:active,.dp .di.on{background:color-mix(in srgb,var(--teal) 12%,transparent)}.dp .di.soon{color:var(--mute);font-weight:500}.dp .di small{margin-left:auto;font-size:11px;font-weight:600;background:var(--line);color:var(--mute);padding:2px 8px;border-radius:99px}
@keyframes dfi{from{opacity:0}}@keyframes dsl{from{transform:translateX(-100%)}}

/* ===== Tương phản: nút và nhãn dễ đọc hơn (mọi màn hình) ===== */
:root{--g1:#1f6a50;--g2:#154d3a;--amber:#566761}

.btn{font-weight:700;letter-spacing:.01em;text-shadow:none}
:root[data-theme="dark"] .btn:not(.alt){background:linear-gradient(135deg,#8fdcbd,#5fc29c);color:#08120e;border-color:transparent}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt){background:linear-gradient(135deg,#8fdcbd,#5fc29c);color:#08120e;border-color:transparent}}

.btn.alt{font-weight:700}
.tag{font-weight:700}

/* ===== Giao diện desktop (từ 1000px): thẻ đặc, viền rõ, hai cột. Điện thoại không bị ảnh hưởng ===== */
.lay aside{display:none}
@media(min-width:1000px){

:root[data-theme="dark"]{--bg:#0a110e;--card:#15201b;--ink:#eef5f1;--mute:#a9b8b0;--line:#30433b;--hair:#30433b;--glass:#15201b;--glass2:#1c2a24;--sh:0 1px 2px rgba(0,0,0,.5),0 10px 24px -14px rgba(0,0,0,.8);--teal:#7fd1b0}
body{background:var(--bg)}body::before{display:none}
.card,.ig,.prog,.tile,.alert,.note{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);-webkit-backdrop-filter:none;backdrop-filter:none}
.ig{border-radius:14px}.card{border-radius:14px}

.chips{flex-wrap:wrap;overflow:visible;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600;-webkit-backdrop-filter:none;backdrop-filter:none}
.chip:hover{border-color:var(--teal)}

:root[data-theme="dark"] .chip.on{color:#0a110e}

.btn.alt{background:var(--card);border:1px solid var(--teal);color:var(--teal);-webkit-backdrop-filter:none;backdrop-filter:none}
.seg{background:var(--card);border-color:var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
.top{background:var(--card);border-bottom:1px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.topi{max-width:1160px;height:64px;padding:0 24px;gap:10px}
.brand{font-size:22px}
.top nav button{font-size:15px;padding:10px 16px}
#app{max-width:1160px;padding:92px 24px 56px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.lay.one{display:block}.lay.one>main{max-width:720px;margin:0 auto}
.lay>main{min-width:0}
.lay aside{display:block;position:sticky;top:88px}

.bar h1{font-size:26px}
.card>img{max-height:440px;object-fit:contain;background:var(--glass2)}

.ig{margin:0 0 16px}
.igh{padding:12px 14px}.igc{padding:4px 16px 14px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:24px 0 10px}

}

async function newView(){var us=U.units.filter(function(u){return u.status!=="rejected"});if(!draft.du&&us[0])draft.du=us[0].unit_id;var h=bar("Gửi phản ánh","voc");h+='<div class="card"><label>Căn hộ của bạn</label><select id="du">'+us.map(function(u){return '<option value="'+u.unit_id+'"'+(String(draft.du)===String(u.unit_id)?" selected":"")+'>Tầng '+u.units.floor+" · căn "+esc(u.units.label)+(u.status==="pending"?" (chờ xác minh)":"")+'</option>'}).join("")+'</select><label>Chủ đề</label><select id="dt">'+TOPICS.map(function(t){return '<option'+(draft.dt===t?" selected":"")+'>'+t+'</option>'}).join("")+'</select><label>Khu vực xảy ra</label><select id="da">'+AREAS.map(function(t){return '<option'+(draft.da===t?" selected":"")+'>'+t+'</option>'}).join("")+'</select><label>Mô tả ngắn</label><textarea id="dd" rows="4" placeholder="Chuyện gì đang xảy ra, từ khi nào?">'+esc(draft.dd||"")+'</textarea><label>Ảnh bằng chứng (tối đa 3)</label><div class="row"><label class="btn sm alt" style="margin:0;cursor:pointer">📷 Chụp ảnh<input type="file" accept="image/*" capture="environment" hidden onchange="fileShot(this,false)"></label><label class="btn sm alt" style="margin:0;cursor:pointer">🖼 Tải ảnh lên<input type="file" accept="image/*" multiple hidden onchange="fileShot(this,true)"></label></div><div class="row" style="margin-top:8px">'+shots.map(function(s,i){return '<div style="position:relative"><img src="'+s.th+'" style="width:92px;height:92px;object-fit:cover;border-radius:10px;margin:0"><button class="btn sm" style="position:absolute;top:2px;right:2px;padding:2px 8px" onclick="keepDraft();shots.splice('+i+',1);render()">✕</button></div>'}).join("")+'</div><div class="mute" style="margin-top:6px">Ảnh được đóng dấu giờ máy chủ, tòa, tầng, khu vực và có mã băm SHA-256 để làm bằng chứng.</div><button class="btn" onclick="submitCase()">Gửi phản ánh</button></div>';return h}
function fileShot(inp,up){var fl=Array.prototype.slice.call(inp.files,0,3-shots.length);inp.value="";if(!fl.length)return toast("Tối đa 3 ảnh");keepDraft();var n=0,done=function(){if(++n===fl.length)render()};fl.forEach(function(f){var im=new Image();im.onload=function(){var k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);var t=document.createElement("canvas");t.width=t.height=200;var m=Math.min(c.width,c.height);t.getContext("2d").drawImage(c,(c.width-m)/2,(c.height-m)/2,m,m,0,0,200,200);shots.push({cv:c,th:t.toDataURL("image/jpeg",.7),up:up,lm:f.lastModified});URL.revokeObjectURL(im.src);done()};im.onerror=function(){done()};im.src=URL.createObjectURL(f)})}
function stampCanvas(cv,text){var c=document.createElement("canvas");c.width=cv.width;c.height=cv.height;var x=c.getContext("2d");x.drawImage(cv,0,0);var fs=Math.max(13,Math.round(c.width/34));x.font="600 "+fs+"px sans-serif";x.fillStyle="rgba(0,0,0,.6)";x.fillRect(0,c.height-fs*2.2,c.width,fs*2.2);x.fillStyle="#fff";x.textBaseline="middle";x.fillText(text,fs*.6,c.height-fs*1.1,c.width-fs*1.2);return c}
function toBlob(c){return new Promise(function(res){c.toBlob(res,"image/jpeg",.78)})}
async function sha256(b){var h=await crypto.subtle.digest("SHA-256",await b.arrayBuffer());return Array.prototype.map.call(new Uint8Array(h),function(x){return x.toString(16).padStart(2,"0")}).join("")}
function submitCase(){act(async function(){keepDraft();var d=draft.dd&&draft.dd.trim();if(!d)return toast("Hãy mô tả ngắn vấn đề");var u=U.units.filter(function(x){return String(x.unit_id)===String(draft.du)})[0];if(!u)return toast("Chọn căn hộ");var topic=draft.dt||TOPICS[0],area=draft.da||AREAS[0],row=await q(sb.from("cases").insert({topic:topic,area:area,tower:"TT01",floor:u.units.floor,unit_id:u.unit_id,description:d}).select("id,created_at").single()),me=U.s.user.id,rows=[],fail=0;for(var i=0;i<shots.length;i++){try{var s=shots[i],ex=s.up?"[Tải lên"+(s.lm?", chụp gốc "+stamp(s.lm):"")+"] ":"",cv=stampCanvas(s.cv,ex+stamp(row.created_at)+" - Tòa TT01, Tầng "+u.units.floor+" - "+area),b=await toBlob(cv),hash=await sha256(b),path=me+"/"+row.id+"/"+(i+1)+".jpg",r=await sb.storage.from("evidence").upload(path,b,{contentType:"image/jpeg",upsert:false});if(r.error)throw r.error;rows.push({case_id:row.id,path:path,sha256:hash,stamp:ex+stamp(row.created_at)+" - Tòa TT01, Tầng "+u.units.floor+" - "+area,source:s.up?"upload":"camera",original_time:s.up&&s.lm?new Date(s.lm).toISOString():null})}catch(e){fail++;console.error(e)}}if(rows.length)await q(sb.from("case_photos").insert(rows));shots=[];draft={};if(fail)toast("Có "+fail+" ảnh tải lên bị lỗi");go("case",row.id)})}

function resizeTo(f,max,sq){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var c=document.createElement("canvas"),k,sx=0,sy=0,sw=im.width,sh=im.height;if(sq){var m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;c.width=c.height=max}else{k=Math.min(1,max/Math.max(sw,sh));c.width=Math.round(sw*k);c.height=Math.round(sh*k)}c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);URL.revokeObjectURL(im.src);c.toBlob(res,"image/jpeg",.8)};im.onerror=rej;im.src=URL.createObjectURL(f)})}
